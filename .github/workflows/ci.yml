name: CI

# Runs the checks that are reproducible on a fresh clone: reproducible install
# from the committed lockfile, ESLint over all source and test code, and the
# Node unit suite for the release build tooling.
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Supersede runs instead of queueing them. Every push to a pull request starts
# a fresh run; without this, an abandoned branch holds a hosted runner slot for
# the full 6h job timeout and starves the queue, which is exactly how jobs end
# up "not acquired by Runner of type hosted".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and test (Node ${{ matrix.node }})
    # Pinned image, not `ubuntu-latest`: the floating label is mid-migration to
    # Ubuntu 26, and label churn drops queued jobs instead of running them.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
    steps:
      # Third-party actions are pinned to immutable commit SHAs, not mutable
      # tags: a tag can be repointed at new code, which would run an
      # unreviewed commit with this workflow's credentials. Dependabot
      # (.github/dependabot.yml) keeps the SHAs current.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` (not `npm install`) so CI can never silently resolve a
      # different dependency tree than the one the lockfile pins.
      # `--ignore-scripts` keeps install-time code execution off: the lint and
      # unit-test paths are pure JavaScript and need none of the five install
      # scripts in the tree, all of which belong to the WCT/Sauce Labs browser
      # harness. `--no-audit` defers to the dedicated dependency-audit job
      # instead of paying for the same audit twice.
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests (release build tooling)
        run: npm run test:node

      - name: Unit tests with coverage
        run: npm run test:coverage

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The published library has no runtime dependencies; everything is a
      # devDependency, so this audits the whole toolchain. The 2016-era tool
      # chain (gulp 3, wct 4) carries known advisories that cannot be cleared
      # without a major toolchain migration, so this step reports rather than
      # blocks. Flip `continue-on-error` to false once that migration lands.
      - name: npm audit (high/critical)
        continue-on-error: true
        run: npm audit --audit-level=high
